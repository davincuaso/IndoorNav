name: Portfolio native captures
on:
  push:
    branches: [portfolio-native-captures]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: indoornav
            repo: IndoorNav
            ref: 0df48c0cfbf16bbaa50602272a5cba4b588319f1
    steps:
      - uses: actions/checkout@v4
        with:
          path: capture-tools
      - uses: actions/checkout@v4
        with:
          repository: davincuaso/${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: app
      - name: Prepare real app sources and sample data
        run: |
          command -v xcodegen || brew install xcodegen
          python3 capture-tools/docs/portfolio/capture-support/prepare.py ${{ matrix.key }}
          xcodegen generate --spec project.json
          xcrun simctl list devices available -j > devices.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('devices.json'))
          phones=[x for runtime,devices in d['devices'].items() if 'iOS' in runtime for x in devices if x['name'].startswith('iPhone') and x['isAvailable']]
          print('SIMULATOR_ID='+phones[0]['udid'])
          PY
      - name: Run the apps in an iPhone simulator
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl status_bar "$SIMULATOR_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          set -o pipefail
          xcodebuild test -project PortfolioCapture.xcodeproj -scheme PortfolioCapture -destination "id=$SIMULATOR_ID" -parallel-testing-enabled NO -resultBundlePath capture.xcresult CODE_SIGNING_ALLOWED=NO > build.log 2>&1
      - name: Export captured screens
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d capture.xcresult ]; then xcrun xcresulttool export attachments --path capture.xcresult --output-path screenshots || true; fi
          tail -80 build.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.key }}
          path: |
            screenshots
            build.log
            project.json
          retention-days: 14
